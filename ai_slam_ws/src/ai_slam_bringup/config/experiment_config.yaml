  rywak:
    scan_topic: /scan_slam_rywak_relay
    base_frame: base_link_rywak
    odom_frame: odom_rywak
    map_frame: map_rywak
  # Dedicated slam_toolbox instance for the odometry-only custom SLAM track (tor9).
  # The relayed scan and the TF chain (odom_odom_only -> base_link_odom_only) are
  # produced by ``odom_only_node`` from /odom_raw alone, with no model in the loop.
  odom_only:
    scan_topic: /scan_slam_odom_only_relay
    base_frame: base_link_odom_only
    odom_frame: odom_odom_only
    map_frame: map_odom_only
    minimum_travel_heading: 0.08
    map_update_interval: 3.0
