# =====================================================================
# Odometry-only custom SLAM track (tor9_odom_only).
# Reuses the same node-level structure as the model-based variants:
#   odom_only_node ---> /pose_odom_only (+ TF) ---> slam_toolbox_odom_only
#                  \--> /pose_odom_only_no_slam   (raw integrated odom, no SLAM)
#                  \--> /scan_slam_odom_only_relay (lidar relay for SLAM)
# But the motion source is exclusively /odom_raw — there is no model.
# =====================================================================
odom_only:
  # The node never reads /ground_truth_pose (no GT subscription is created at
  # all — see odom_only_node.py), so there is no init_from or gt_topic to set.
  # The integrated pose is exactly the latest /odom_raw sample (optionally
  # rebased to a local origin), which is what slam_toolbox uses as its TF
  # prediction. This is the same convention as Robak/Rywak with
  # use_odom_corrections / force_odom_pose disabled.
  infer_odom_topic: /odom_raw
  odom_rebase_to_local_origin: false
  publish_no_slam_pose: true
  publish_rate_hz: 20.0
  # Topics / frames produced by this track. They are kept distinct from the
  # other tracks so eval results, maps and TFs can be compared 1:1.
  pose_topic: /pose_odom_only
  pose_topic_no_slam: /pose_odom_only_no_slam
  relay_scan_topic: /scan_slam_odom_only_relay
  scan_topic: /scan_slam_odom_only
  tf_parent: odom_odom_only
  tf_child: base_link_odom_only
rywak_no_slam:
  infer_odom_topic: /odom_raw
  infer_init_from_odom_topic: /odom_raw
  sync_tolerance_sec: 0.1
  interpolate_odom: true
  sync_pair_gap_sec: 0.25
  delta_scan_clip: 2.0
  v_clip_abs: 2.0
  w_clip_abs: 3.0
  vel_ema_alpha: 0.0
  max_integration_dt: 0.22
  odom_rebase_to_local_origin: false
  use_odom_corrections: false
  odom_fallback_before_model_ready: true
  fuse_odom_v_weight: 0.0
  fuse_odom_w_weight: 0.0
  fuse_odom_v_gain: 0.0
  fuse_odom_w_gain: 0.0
  anchor_yaw_to_odom: 0.0
  anchor_yaw_to_odom_gain: 0.0
  anchor_xy_to_odom: 0.0
  anchor_xy_to_odom_gain: 0.0
  heading_for_xy_odom_weight: 0.0
  xy_step_odom_weight: 0.0
  xy_step_odom_gain: 0.0
  max_step_trans: 0.15
  max_step_yaw: 0.35
  odom_guard_enabled: false
  odom_guard_fuse_weight: 0.0
  odom_guard_v_abs_diff: 0.0
  odom_guard_v_rel_diff: 0.0
  odom_guard_w_abs_diff: 0.0
  odom_guard_w_rel_diff: 0.0
  odom_guard_sign_conflict_speed: 0.0
  odom_guard_xy_error_m: 0.0
  odom_guard_xy_anchor_base: 0.0
  odom_guard_xy_anchor_gain: 0.0
  odom_guard_yaw_error_rad: 0.0
  odom_guard_yaw_anchor_base: 0.0
  odom_guard_yaw_anchor_gain: 0.0
  force_odom_pose: false
  v_bias_correction: 0.0
  w_bias_correction: 0.0
