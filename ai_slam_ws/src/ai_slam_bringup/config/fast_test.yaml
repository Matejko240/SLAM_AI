# ============================================================================
# AI SLAM - Szybka Konfiguracja Testowa
# ============================================================================
# Krótki eksperyment do szybkiego testowania (ok. 30-40 sekund)
# Użycie: ros2 launch ai_slam_bringup demo.launch.py config:=fast_test.yaml
# ============================================================================

experiment:
  mode: "ai"
  seed: 42
  gui: false

pipeline:
  dataset_collection_sec: 15.0
  evaluation_sec: 25.0

timing:
  dataset_start_delay: 5.0
  dataset_wait_timeout: 30.0
  bridge_delay: 3.0
  spawn_delay: 5.0
  slam_configure_delay: 2.0

dataset:
  max_samples: 200
  sample_rate: 10.0
  scan_topic: "/scan"
  odom_topic: "/odom"
  gt_topic: "/ground_truth_pose"
  sync_tolerance_sec: 0.08
  sync_pair_gap_sec: 0.20
  interpolate_odom: true
  interpolate_gt: true

ground_truth:
  use_tf_world: true
  tf_world_topic: "/tf_world"
  tf_world_timeout_sec: 0.5
  publish_odom_fallback: false
  restamp_output_to_now: true
  model_name_hint: "diffbot"
  base_link_hint: "base_link"
  world_frame_hint: "world"
  heuristic_max_score: 12.0
  heuristic_bootstrap_max_score: 64.0
  heuristic_max_step_m: 0.8
  debug_every_n: 1000

training:
  max_epochs: 50                # Mniej epok
  patience: 10                  # Szybszy early stopping
  min_delta: 0.0001
  learning_rate: 0.001
  batch_size: 64
  validation_ratio: 0.2
  skip_if_model_exists: true

inference:
  model_wait_timeout: 0

evaluation:
  compute_rmse: true
  compute_iou: true
  save_trajectory_plot: true
  save_error_plot: true
  save_map_comparison: true
  points_min_translation: 0.04
  points_min_rotation: 0.08
  points_filter_mode: "any"

robak:
  min_pair_dist: 0.03
  min_pair_dyaw: 0.05
  pair_filter_mode: "any"
  trajectory_mode: "any"
  trajectory_cell_size_m: 0.2
  cycle_min_repeat_hits: 1
  sync_pair_gap_sec: 0.20
  interpolate_gt: true

rywak:
  min_sample_dist: 0.03
  min_sample_dyaw: 0.04
  min_delta_scan_rms: 0.04
  sample_filter_mode: "any"
  balance_histograms: true
  balance_bins: 12
  trajectory_mode: "any"
  trajectory_cell_size_m: 0.2
  cycle_min_repeat_hits: 1

odometry:
  rw_sigma_xy: 0.005
  rw_sigma_theta: 0.003

driver:
  trajectory_mode: auto
  linear_velocity: 0.4          # Trochę szybciej
  angular_velocity: 0.6
  turn_probability: 0.03

output:
  base_dir: "out"
